<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>دفتري الشخصي</title>
<meta name="theme-color" content="#1f6f5c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="دفتري">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f3ee; --card:#fff; --ink:#1f2a2e; --muted:#6b7478; --line:#e6e0d7;
  --acc:#1f6f5c; --acc2:#e8f2ee; --warn:#c2541b; --gold:#b8860b;
  --r:16px; --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 14px rgba(0,0,0,.05);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#121617;--card:#1b2123;--ink:#e9ecea;--muted:#9aa4a6;--line:#2a3133;--acc:#4fb394;--acc2:#1d2e29;--warn:#e98552;--gold:#d9a93a;--shadow:none}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Tajawal",system-ui,sans-serif;direction:rtl;text-align:right}
body{padding-bottom:150px}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 24px}
header.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:4px 0 14px}
header.top h1{font-size:24px;margin:0;font-weight:800}
header.top .sub{color:var(--muted);font-size:14px;margin-top:4px;line-height:1.6}
.sync{font-size:12px;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 10px;white-space:nowrap}
.sync.ok{color:var(--acc)}
.sync.warn{color:var(--warn)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);margin-bottom:12px}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin:18px 2px 8px}
.sec-h h2{font-size:17px;margin:0;font-weight:700}
.muted{color:var(--muted)}
.small{font-size:13px}
.empty{color:var(--muted);text-align:center;padding:18px 8px;font-size:14px}
.btn{border:0;background:var(--acc);color:#fff;border-radius:12px;padding:10px 16px;font-weight:700}
.btn.ghost{background:var(--acc2);color:var(--acc)}
.btn.danger{background:transparent;color:var(--warn);border:1px solid var(--warn)}
.btn.sm{padding:6px 12px;font-size:14px;border-radius:10px}
.icon-btn{border:0;background:transparent;padding:6px;border-radius:8px;color:var(--muted);font-size:18px;line-height:1}
.fab{position:fixed;left:18px;bottom:96px;width:56px;height:56px;border-radius:50%;border:0;background:var(--acc);color:#fff;font-size:30px;box-shadow:0 6px 18px rgba(0,0,0,.2);z-index:20}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(8px + env(safe-area-inset-bottom));z-index:30}
nav.tabs button{flex:1;min-width:0;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;color:var(--muted);font-size:11px;font-weight:500;white-space:nowrap}
nav.tabs button .i{font-size:21px;line-height:1}
@media (max-width:400px){nav.tabs button{font-size:10px;letter-spacing:-.2px}nav.tabs button .i{font-size:19px}}
nav.tabs button.on{color:var(--acc);font-weight:700}
/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-size:24px;font-weight:800;color:var(--acc)}
.stat span{font-size:12px;color:var(--muted)}
/* tasks */
.task{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.chk{width:24px;height:24px;border-radius:8px;border:2px solid var(--acc);background:transparent;flex:none;display:grid;place-items:center;color:#fff;font-size:15px;padding:0}
.chk.on{background:var(--acc)}
.task .t{flex:1;min-width:0}
.task .t .ttl{font-weight:500;word-break:break-word}
.task.done .ttl{text-decoration:line-through;color:var(--muted)}
.task .meta{font-size:12px;color:var(--muted);margin-top:2px}
.pri{width:8px;height:8px;border-radius:50%;flex:none}
.p0{background:transparent}.p1{background:var(--gold)}.p2{background:var(--warn)}
/* week */
.weeknav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.weeknav b{font-size:15px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 0 6px;text-align:center;font-size:12px;color:var(--muted)}
.day .n{display:block;font-size:18px;font-weight:700;color:var(--ink);margin:2px 0}
.day .dots{height:6px;display:flex;justify-content:center;gap:2px}
.day .dots i{width:5px;height:5px;border-radius:50%;background:var(--acc)}
.day.today .n{color:var(--acc)}
.day.sel{background:var(--acc);border-color:var(--acc);color:#e5f3ee}
.day.sel .n{color:#fff}.day.sel .dots i{background:#fff}
/* notes */
.search{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 14px;margin-bottom:12px;outline:none}
.notes{columns:2;column-gap:10px}
@media (max-width:420px){.notes{columns:1}}
.note{break-inside:avoid;border-radius:14px;padding:12px 14px;margin-bottom:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;box-shadow:var(--shadow)}
.note h3{margin:0 0 6px;font-size:16px;word-break:break-word}
.note p{margin:0;font-size:14px;line-height:1.7;white-space:pre-wrap;word-break:break-word;max-height:10.2em;overflow:hidden;color:var(--ink)}
.note .foot{margin-top:8px;font-size:11px;color:var(--muted);display:flex;justify-content:space-between}
.c-none{}
.c-green{background:#e4f2ea;border-color:#cfe6d8}.c-yellow{background:#fbf3d6;border-color:#efe2b0}
.c-blue{background:#e3eef9;border-color:#cddff2}.c-pink{background:#f9e5e8;border-color:#f0ced4}.c-sand{background:#f1e9dd;border-color:#e3d6c3}
@media (prefers-color-scheme:dark){
 .c-green{background:#1e3329;border-color:#2b4639}.c-yellow{background:#3a331b;border-color:#4d4426}
 .c-blue{background:#1d2b3a;border-color:#2a3d52}.c-pink{background:#3a2228;border-color:#4f2f37}.c-sand{background:#342d23;border-color:#463c2f}
}
/* routines */
.rt{padding:12px 14px}
.rt-h{display:flex;align-items:center;gap:10px}
.rt-h .em{font-size:26px}
.rt-h .nm{flex:1;min-width:0}
.rt-h .nm b{display:block;font-size:16px}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0 4px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:6px;transition:width .2s}
.rt-items{margin-top:6px}
.rt-item{display:flex;align-items:center;gap:10px;padding:7px 0}
.rt-item.done span{text-decoration:line-through;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.seg{display:flex;background:var(--acc2);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:transparent;padding:8px;border-radius:10px;color:var(--acc);font-weight:500}
.seg button.on{background:var(--card);box-shadow:var(--shadow);font-weight:700}
/* sheet */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:50;display:none;align-items:flex-end;justify-content:center}
.overlay.show{display:flex}
.sheet{background:var(--card);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));animation:up .18s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.sheet h2{margin:0 0 12px;font-size:18px}
.sheet .actions{position:sticky;bottom:calc(-18px - env(safe-area-inset-bottom));background:var(--card);margin:8px -16px calc(-18px - env(safe-area-inset-bottom));padding:10px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);z-index:3}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
.inp{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;outline:none}
.inp:focus{border-color:var(--acc)}
textarea.inp{min-height:180px;resize:vertical;line-height:1.8}
.row{display:flex;gap:10px}.row>*{flex:1}
.actions{display:flex;gap:8px;justify-content:space-between;margin-top:8px}
.actions .r{display:flex;gap:8px}
.colors{display:flex;gap:8px}
.colors button{width:30px;height:30px;border-radius:50%;border:2px solid var(--line)}
.colors button.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc2)}
.item-edit{display:flex;gap:6px;margin-bottom:6px}
.item-edit .inp{flex:1}
.toast{position:fixed;bottom:96px;right:50%;transform:translateX(50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.pin{color:var(--gold)}
/* lock */
body.locked #app, body.locked nav.tabs, body.locked .fab, body.locked .overlay{display:none!important}
.lock{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px;overflow:auto}
.lk-in{width:100%;max-width:300px;text-align:center}
.lk-logo{font-size:44px}
.lk-in h2{margin:6px 0 4px;font-size:20px}
.lk-msg{color:var(--muted);min-height:22px;font-size:14px}
.dots{display:flex;justify-content:center;gap:14px;margin:18px 0 24px;direction:ltr}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--acc)}
.dots i.on{background:var(--acc)}
.dots.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;direction:ltr}
.pad button{height:64px;border-radius:20px;border:1px solid var(--line);background:var(--card);font-size:26px;font-weight:500;color:var(--ink)}
.pad button:active{background:var(--acc2)}
.pad button.ghost{background:transparent;border:0;font-size:24px}
.lk-link{background:none;border:0;color:var(--muted);margin-top:20px;font-size:13px;text-decoration:underline}
/* timetable */
.cls{display:flex;gap:10px;align-items:stretch;padding:7px 0;cursor:pointer}
.cls .tm{width:54px;flex:none;text-align:center;font-size:12px;color:var(--muted);padding-top:2px}
.cls .tm b{display:block;font-size:15px;color:var(--ink)}
.cls .bd{flex:1;min-width:0;border-inline-start:4px solid var(--acc);padding:6px 10px;border-radius:8px;background:var(--bg)}
.cls .bd .ttl{font-weight:700;word-break:break-word}
.cls .bd .meta{font-size:12px;color:var(--muted);margin-top:2px}
.cls.past{opacity:.45}
.cls.now .bd{background:var(--acc2)}
.badge{align-self:center;font-size:11px;font-weight:700;border-radius:999px;padding:3px 8px;background:var(--acc);color:#fff;white-space:nowrap}
.badge.next{background:var(--acc2);color:var(--acc)}
/* vehicles */
.fh{font-weight:700;color:var(--acc);margin:14px 0 8px;font-size:14px;border-top:1px solid var(--line);padding-top:12px}
.vcard{display:flex;gap:12px;align-items:center;cursor:pointer}
.vcard .ic{width:48px;height:48px;border-radius:14px;background:var(--acc2);display:grid;place-items:center;font-size:26px;flex:none}
.vcard .t{flex:1;min-width:0}.vcard .t b{display:block;font-size:17px}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.pill{font-size:12px;border-radius:999px;padding:3px 9px;background:var(--acc2);color:var(--acc);white-space:nowrap}
.pill.warn{background:#fbe6db;color:var(--warn)}.pill.bad{background:var(--warn);color:#fff}
@media (prefers-color-scheme:dark){.pill.warn{background:#3d2a20}}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv span:nth-child(odd){color:var(--muted)}
.kv span:nth-child(even){word-break:break-word}
.back{border:0;background:transparent;color:var(--acc);font-weight:700;padding:4px 0;margin-bottom:6px}
.logrow{display:flex;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.logrow:last-child{border-bottom:0}
.logrow .ic{font-size:20px;width:28px;text-align:center;flex:none}
.logrow .t{flex:1;min-width:0}.logrow .t b{font-weight:500}
.logrow .meta{font-size:12px;color:var(--muted)}
.logrow .c{font-size:13px;font-weight:700;white-space:nowrap}
.cmpwrap{overflow-x:auto;margin:0 -16px;padding:0 16px 6px}
table.cmp{border-collapse:separate;border-spacing:0;font-size:13px;min-width:100%}
table.cmp th,table.cmp td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:center;vertical-align:top;min-width:120px;background:var(--card)}
table.cmp th:first-child,table.cmp td:first-child{position:sticky;right:0;z-index:1;min-width:96px;text-align:right;color:var(--muted);font-weight:500;background:var(--bg)}
table.cmp thead th{font-size:14px;color:var(--ink);font-weight:800;cursor:pointer}
table.cmp td.best{color:var(--acc);font-weight:800}
table.cmp tr.sec td{background:var(--acc2);color:var(--acc);font-weight:700;text-align:right}
.stars{color:var(--gold);letter-spacing:1px;white-space:nowrap}
.modrow{display:flex;gap:10px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line)}
.modrow:last-child{border-bottom:0}
.modrow .t{flex:1;min-width:0;cursor:pointer}
.modrow .t b{font-weight:500}
.modrow .meta{font-size:12px;color:var(--muted)}
.chk-line{display:flex;align-items:center;gap:8px;font-size:14px;margin:4px 0 10px}
.chk-line input{width:20px;height:20px;accent-color:var(--acc)}
.day.hol{background:#fbf3d6;border-color:#efe2b0}
@media (prefers-color-scheme:dark){.day.hol{background:#3a331b;border-color:#4d4426}}
.day.hol.sel{background:var(--acc);border-color:var(--acc)}
.holbanner{display:flex;gap:12px;align-items:center;background:#fbf3d6;border:1px solid #efe2b0;border-radius:var(--r);padding:14px;margin-bottom:12px}
@media (prefers-color-scheme:dark){.holbanner{background:#3a331b;border-color:#4d4426}}
.holbanner .e{font-size:28px}.holbanner b{display:block}
.fnav{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 8px;margin:0 -16px 8px;padding-inline:16px;scrollbar-width:none}
.fnav::-webkit-scrollbar{display:none}
.fnav .chip{flex:none;white-space:nowrap}
.stages{display:flex;gap:4px;margin:4px 0 10px}
.stages button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 2px;font-size:11px;color:var(--muted);line-height:1.4}
.stages button b{display:block;font-size:16px}
.stages button.done{background:var(--acc2);color:var(--acc);border-color:var(--acc2)}
.stages button.cur{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:700}
.wex{border-inline-start:4px solid var(--line)}
.wex.st-done{border-inline-start-color:var(--acc)}.wex.st-run{border-inline-start-color:var(--gold)}.wex.st-plan{border-inline-start-color:#5b7fb8}
.ck{display:flex;align-items:center;gap:10px;padding:7px 0;cursor:pointer}
.ck.on span{text-decoration:line-through;color:var(--muted)}
.day-h{display:flex;justify-content:space-between;align-items:center;font-weight:700;margin:2px 0 4px}
/* money */
.mnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.mnav b{font-size:16px}
.msum{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.msum .stat b{font-size:20px}
.msum .stat.out b{color:var(--warn)}
.msum .stat small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.catrow{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:14px}
.catrow .nm{width:92px;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.catrow .bar{flex:1;margin:0;height:8px}
.catrow .v{width:96px;flex:none;text-align:left;font-variant-numeric:tabular-nums;font-size:13px}
.exp{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.exp:last-child{border-bottom:0}
.exp .ic{width:36px;height:36px;border-radius:10px;background:var(--acc2);display:grid;place-items:center;font-size:18px;flex:none}
.exp .t{flex:1;min-width:0}
.exp .t .ttl{font-weight:500}
.exp .t .meta{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exp .amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.exp .amt.in{color:var(--acc)}
.dgrp{font-size:13px;color:var(--muted);margin:12px 4px 4px;font-weight:700}
.amount-inp{font-size:28px;font-weight:800;text-align:center;direction:ltr}
.catgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.catgrid .chip{text-align:center;padding:8px 4px}
.ratebar{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:8px 12px;margin-bottom:12px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<button class="fab" id="fab" aria-label="إضافة">+</button>
<nav class="tabs" id="tabs">
  <button data-tab="today" class="on"><span class="i">☀️</span>اليوم</button>
  <button data-tab="plan"><span class="i">🗓️</span>المخطط</button>
  <button data-tab="money"><span class="i">💰</span>المصاريف</button>
  <button data-tab="farm"><span class="i">🌾</span>المزرعة</button>
  <button data-tab="kids"><span class="i">👨‍👩‍👧</span>الأطفال</button>
  <button data-tab="cars"><span class="i">🚙</span>المركبات</button>
  <button data-tab="notes"><span class="i">📝</span>المذكرات</button>
</nav>
<div class="overlay" id="ov"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const keyOf = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parseKey = k => { const [y,m,d] = k.split("-").map(Number); return new Date(y,m-1,d); };
const todayKey = () => keyOf(new Date());
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
function ayam(n){ n=Math.abs(n); return n===1?"يوم واحد":n===2?"يومين":(n>=3&&n<=10)?n+" أيام":n+" يوماً"; }
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const DAYS = ["الأحد","الإثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
const DAYS_S = ["أحد","إثنين","ثلاثاء","أربعاء","خميس","جمعة","سبت"];
const fmtG = new Intl.DateTimeFormat("ar-u-nu-latn",{day:"numeric",month:"long",year:"numeric"});
const fmtShort = new Intl.DateTimeFormat("ar-u-nu-latn",{day:"numeric",month:"long"});
let fmtH = null; try{ fmtH = new Intl.DateTimeFormat("ar-SA-u-ca-islamic-umalqura-nu-latn",{day:"numeric",month:"long",year:"numeric"}); }catch(e){}
const COLORS = ["none","green","yellow","blue","pink","sand"];
const COLOR_SWATCH = {none:"var(--card)",green:"#cfe6d8",yellow:"#efe2b0",blue:"#cddff2",pink:"#f0ced4",sand:"#e3d6c3"};

/* ---------- storage (on this device) ---------- */
const COLS = ["notes","tasks","routines","expenses","classes","settings","vehicles","vlogs","candidates","mods","kids","krec","holidays","farmp","farml","farmw","farmwl","fitem","fev"];
const S = { data:{}, syncState:"local" };
COLS.forEach(c=>S.data[c]={});
const LKEY = "daftar.local.v1", BKEY = "daftar.lastBackup";
let storageOK = true;
function loadLocal(){ try{ const j = JSON.parse(localStorage.getItem(LKEY)||"null"); if(j) COLS.forEach(c=>S.data[c]=j[c]||{}); }catch(e){ storageOK=false; } }
let saveT=null;
function saveLocal(){ clearTimeout(saveT); saveT=setTimeout(saveNow,150); }
function saveNow(){ if(window.__wiping) return; try{ localStorage.setItem(LKEY, JSON.stringify(S.data)); storageOK=true; }catch(e){ storageOK=false; toast("تعذّر الحفظ! خذ نسخة احتياطية الآن"); } }
window.addEventListener("pagehide", saveNow);
document.addEventListener("visibilitychange", ()=>{ if(document.hidden) saveNow(); });
loadLocal();
try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
function setSync(){
  const el = $("#sync"); if(!el) return;
  el.className = "sync " + (storageOK?"ok":"warn");
  el.textContent = storageOK? "📱 محفوظ على الهاتف" : "⚠️ مشكلة في الحفظ";
}
function put(col, id, obj){ S.data[col][id] = obj; saveLocal(); render(); }
function del(col, id){ delete S.data[col][id]; saveLocal(); render(); }
function lastBackupDays(){ try{ const t=+localStorage.getItem(BKEY)||0; return t? Math.floor((Date.now()-t)/86400000) : null; }catch(e){ return null; } }
function countItems(){ return COLS.filter(c=>c!=="settings").reduce((n,c)=>n+Object.keys(S.data[c]).length,0); }
function downloadBackup(){
  saveNow();
  const blob=new Blob([JSON.stringify(Object.assign({app:"daftar",version:1,exported:new Date().toISOString()},S.data))],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="daftar-"+todayKey()+".json";
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1000);
  try{ localStorage.setItem(BKEY, String(Date.now())); }catch(e){}
  toast("تم تنزيل النسخة في مجلد التنزيلات"); render();
}
function importData(d){
  let n=0;
  COLS.forEach(c=>Object.entries(d[c]||{}).forEach(([k,v])=>{ if(/^[A-Za-z0-9_-]{1,64}$/.test(k) && v && typeof v==="object"){ S.data[c][k]=v; n++; } }));
  saveNow(); render(); return n;
}

  $("#stX").onclick=closeSheet; lockSettingsCard();

const UI = { tab:"today", sel:todayKey(), weekOff:0, noteQ:"", planView:"week", month:todayKey().slice(0,7), vv:"cars", veh:null, modT:"all", kid:null, kv:"edu", fv:"sum", fp:"all" };

/* ---------- derived ---------- */
const tasks = () => Object.entries(S.data.tasks).map(([id,v])=>Object.assign({id},v));
const notes = () => Object.entries(S.data.notes).map(([id,v])=>Object.assign({id},v));
const routines = () => Object.entries(S.data.routines).map(([id,v])=>Object.assign({id},v)).sort((a,b)=>(a.time||"99").localeCompare(b.time||"99"));
function tasksOn(k){ return tasks().filter(t=>t.date===k).sort(taskSort); }
function taskSort(a,b){ return (a.done-b.done) || ((b.priority||0)-(a.priority||0)) || (a.time||"99").localeCompare(b.time||"99") || (a.created||0)-(b.created||0); }
function routinesOn(k){ const wd = parseKey(k).getDay(); return routines().filter(r=>!r.days || r.days.length===0 || r.days.includes(wd)); }
function routineDone(r,k){ return (r.log && r.log[k]) || []; }
function weekStart(off){ const d=new Date(); d.setHours(0,0,0,0); const wd=(d.getDay()+6)%7; return addDays(d,-wd+off*7); } // Monday start

/* ---------- render ---------- */
function headerHTML(title, sub){
  return `<header class="top"><div><h1>${title}</h1><div class="sub">${sub||""}</div></div><div style="display:flex;gap:6px;align-items:center"><span id="sync" class="sync"></span><button class="icon-btn" id="settings" aria-label="الإعدادات">⚙️</button></div></header>`;
}
function taskRow(t, showDate){
  const meta=[];
  if(showDate && t.date) meta.push(fmtShort.format(parseKey(t.date)));
  if(t.time) meta.push("🕒 "+t.time);
  if(t.note) meta.push("📎");
  return `<div class="task ${t.done?"done":""}" data-task="${t.id}">
    <button class="chk ${t.done?"on":""}" data-toggle="${t.id}" aria-label="تم">${t.done?"✓":""}</button>
    <div class="t" data-edit-task="${t.id}"><div class="ttl">${esc(t.title)}</div>${meta.length?`<div class="meta">${esc(meta.join(" · "))}</div>`:""}</div>
    <span class="pri p${t.priority||0}"></span></div>`;
}
function routineCard(r,k,compact){
  const done = routineDone(r,k), n=(r.items||[]).length, c=done.length;
  const pct = n? Math.round(c/n*100):0;
  const days = (!r.days||r.days.length===0||r.days.length===7)?"كل يوم":r.days.slice().sort((a,b)=>((a+6)%7)-((b+6)%7)).map(d=>DAYS_S[d]).join("، ");
  return `<div class="card rt">
    <div class="rt-h"><span class="em">${esc(r.icon||"🔁")}</span>
      <div class="nm"><b>${esc(r.name)}</b><span class="small muted">${r.time?"🕒 "+esc(r.time)+" · ":""}${days}</span></div>
      <span class="small muted">${c}/${n}</span>
      <button class="icon-btn" data-edit-rt="${r.id}" aria-label="تعديل">✎</button></div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    ${compact && c===n && n>0 ? `<div class="small" style="color:var(--acc)">✓ اكتمل برنامج اليوم</div>` :
    `<div class="rt-items">${(r.items||[]).map((it,i)=>{const on=done.includes(i);return `<div class="rt-item ${on?"done":""}"><button class="chk ${on?"on":""}" data-rt="${r.id}" data-i="${i}" data-k="${k}">${on?"✓":""}</button><span>${esc(it)}</span></div>`;}).join("")}</div>`}
  </div>`;
}

const KINDS = {class:{l:"حصة",c:"var(--acc)"}, duty:{l:"مناوبة",c:"var(--warn)"}, meet:{l:"اجتماع",c:"#5b7fb8"}, other:{l:"أخرى",c:"var(--gold)"}};
const SCHOOL_DAYS = [1,2,3,4,5];
const classes = () => Object.entries(S.data.classes||{}).map(([id,v])=>Object.assign({id},v)).sort((a,b)=>(a.start||"").localeCompare(b.start||""));
function classesOnWd(wd){ return classes().filter(c=>c.day===wd); }
function nowHM(){ const d=new Date(); return pad(d.getHours())+":"+pad(d.getMinutes()); }
function classList(list, isToday){
  if(!list.length) return "";
  const n=nowHM(); let nextMarked=false;
  return list.map(c=>{
    let st="", badge="";
    if(isToday){
      const end=c.end||c.start;
      if(c.start<=n && n<end){ st="now"; badge='<span class="badge">الآن</span>'; }
      else if(end<=n){ st="past"; }
      else if(!nextMarked){ nextMarked=true; badge='<span class="badge next">التالية</span>'; }
    }
    const k=KINDS[c.kind]||KINDS.class;
    return `<div class="cls ${st}" data-edit-cls="${c.id}"><div class="tm"><b>${esc(c.start||"")}</b>${esc(c.end||"")}</div>
      <div class="bd" style="border-inline-start-color:${k.c}"><div class="ttl">${esc(c.title)}</div><div class="meta">${k.l}${c.room?" · "+esc(c.room):""}</div></div>${badge}</div>`;
  }).join("");
}

const HOLK = {off:["🏖️","عطلة رسمية — لا دوام"], nostudents:["📚","لا دراسة للطلبة — دوام للكادر"], break:["🌴","إجازة"]};
const holidays = () => Object.entries(S.data.holidays||{}).map(([id,v])=>Object.assign({id},v)).sort((a,b)=>(a.from||"").localeCompare(b.from||""));
function holidayOn(k){ return holidays().find(x=>x.from && x.from<=k && k<=(x.to||x.from)) || null; }
function nextHoliday(k){ return holidays().find(x=>x.from>k) || null; }
function holRange(x){ const a=parseKey(x.from), b=parseKey(x.to||x.from); return (x.to&&x.to!==x.from)? fmtShort.format(a)+" – "+fmtShort.format(b) : fmtShort.format(a); }
function holBanner(x){ const k=HOLK[x.kind]||HOLK.off; return `<div class="holbanner"><span class="e">${k[0]}</span><div><b>${esc(x.title)}</b><span class="small muted">${k[1]} · ${holRange(x)}</span></div></div>`; }

const catOf = k => CATS_OUT.concat(CATS_IN).find(c=>c[0]===k) || ["other","📦","أخرى"];
const fmtN = new Intl.NumberFormat("en-US",{maximumFractionDigits:2, minimumFractionDigits:0});
const money = (v,cur) => fmtN.format(v)+" "+(CUR[cur]||cur||"");
const settings = () => (S.data.settings && S.data.settings.main) || {};
const expenses = () => Object.entries(S.data.expenses||{}).map(([id,v])=>Object.assign({id},v));
function parseAmount(s){ s=String(s??"").replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[,٬\s]/g,"").replace(/٫/g,".").replace(/[^\d.]/g,""); const v=parseFloat(s); return isFinite(v)?Math.round(v*100)/100:NaN; }
function toMain(amount, cur){
  const st=settings(), main=st.main||"AED", rate=+st.rate||0; // rate: 1 AED = rate TND
  if(cur===main) return amount;
  if(!rate) return null;
  return main==="AED"? amount/rate : amount*rate;
}
function monthLabel(m){ const [y,mm]=m.split("-").map(Number); return new Intl.DateTimeFormat("ar-u-nu-latn",{month:"long",year:"numeric"}).format(new Date(y,mm-1,1)); }
function shiftMonth(m,n){ const [y,mm]=m.split("-").map(Number); const d=new Date(y,mm-1+n,1); return d.getFullYear()+"-"+pad(d.getMonth()+1); }
function renderMoney(){
  const m=UI.month, st=settings(), main=st.main||"AED";
  const list=expenses().filter(e=>(e.date||"").slice(0,7)===m).sort((a,b)=>(b.date||"").localeCompare(a.date||"")||(b.created||0)-(a.created||0));
  const byCur={}; list.forEach(e=>{ const c=byCur[e.cur]||(byCur[e.cur]={in:0,out:0}); c[e.type==="in"?"in":"out"]+=e.amount; });
  let outMain=0, inMain=0, unconverted=false; const cats={};
  list.forEach(e=>{ const v=toMain(e.amount,e.cur); if(v==null){ unconverted=true; return; } if(e.type==="in") inMain+=v; else { outMain+=v; cats[e.cat]=(cats[e.cat]||0)+v; } });
  const catList=Object.entries(cats).sort((a,b)=>b[1]-a[1]); const maxC=catList.length?catList[0][1]:1;
  const curs=Object.keys(byCur);
  const multi = curs.length>1 || (curs.length===1 && curs[0]!==main);
  const groups={}; list.forEach(e=>{ (groups[e.date]=groups[e.date]||[]).push(e); });
  return headerHTML("المصاريف","مصروفاتك ودخلك شهراً بشهر") + `
  <div class="mnav"><button class="icon-btn" data-month="-1" aria-label="الشهر السابق">→</button><b>${monthLabel(m)}</b><button class="icon-btn" data-month="1" aria-label="الشهر التالي">←</button></div>
  <div class="msum">
    <div class="stat out"><b>${unconverted&&!outMain?"—":money(outMain,main)}</b><span>المصروف${multi?" (بال"+CUR[main]+")":""}</span></div>
    <div class="stat"><b>${unconverted&&!inMain?"—":money(inMain,main)}</b><span>الدخل${multi?" (بال"+CUR[main]+")":""}</span></div>
  </div>
  ${multi?`<div class="card small">${curs.map(c=>`<div style="display:flex;justify-content:space-between;padding:3px 0"><span>بال${CUR[c]}</span><span>مصروف ${money(byCur[c].out,c)} · دخل ${money(byCur[c].in,c)}</span></div>`).join("")}</div>`:""}
  <div class="ratebar"><span>${st.rate?`سعر الصرف: 1 درهم = ${fmtN.format(st.rate)} دينار · العملة الأساسية: ${CUR[main]}`:"حدّد سعر الصرف لجمع الدرهم والدينار معاً"}</span><button class="btn ghost sm" id="rateBtn">${st.rate?"تعديل":"تحديد"}</button></div>
  ${unconverted?`<div class="card small" style="color:var(--warn)">بعض المبالغ بعملة أخرى لم تُحسب في المجموع. حدّد سعر الصرف.</div>`:""}
  ${catList.length?`<div class="sec-h"><h2>حسب الفئة</h2></div><div class="card">${catList.map(([k,v])=>{const c=catOf(k);return `<div class="catrow"><span class="nm">${c[1]} ${c[2]}</span><div class="bar"><i style="width:${Math.max(3,v/maxC*100)}%"></i></div><span class="v">${money(v,main)}</span></div>`;}).join("")}</div>`:""}
  <div class="sec-h"><h2>العمليات</h2><button class="btn ghost sm" id="copyMonth">نسخ الملخص</button></div>
  ${list.length? Object.keys(groups).sort().reverse().map(d=>`<div class="dgrp">${DAYS[parseKey(d).getDay()]} ${fmtShort.format(parseKey(d))}</div><div class="card" style="padding:4px 12px">${groups[d].map(e=>{const c=catOf(e.cat);
     return `<div class="exp" data-edit-exp="${e.id}"><span class="ic">${c[1]}</span><div class="t"><div class="ttl">${esc(c[2])}</div>${e.note?`<div class="meta">${esc(e.note)}</div>`:""}</div><span class="amt ${e.type==="in"?"in":""}"><bdi dir="ltr">${e.type==="in"?"+":"−"}${fmtN.format(e.amount)}</bdi> ${CUR[e.cur]||""}</span></div>`;}).join("")}</div>`).join("")
   : `<div class="card empty">لا عمليات في هذا الشهر. اضغط + لتسجيل مصروف.</div>`}`;
}

function monthSummaryText(){
  const m=UI.month, st=settings(), main=st.main||"AED";
  const list=expenses().filter(e=>(e.date||"").slice(0,7)===m);

/* ---------- generic forms ---------- */
function fieldHTML(f, obj){
  const v = obj[f.k]==null? "" : obj[f.k];
  if(f.t==="row") return `<div class="row">${f.f.map(x=>fieldHTML(x,obj)).join("")}</div>`;
  if(f.t==="h") return `<div class="fh">${f.l}</div>`;
  if(f.t==="chips"){ const cur = v===""? (f.d??"") : String(v);
    return `<div class="field"><label>${f.l}</label><div class="chips" data-chips="${f.k}">${f.o.map(([val,lab])=>`<button type="button" class="chip ${cur===String(val)?"on":""}" data-v="${val}">${lab}</button>`).join("")}</div></div>`; }
  if(f.t==="select"){ const cur = v===""? (f.d??"") : String(v);
    return `<div class="field"><label>${f.l}</label><select class="inp" data-k="${f.k}">${f.o.map(([val,lab])=>`<option value="${esc(val)}" ${cur===String(val)?"selected":""}>${esc(lab)}</option>`).join("")}</select></div>`; }
  if(f.t==="check") return `<label class="chk-line"><input type="checkbox" data-k="${f.k}" ${(v===""?f.d:v)?"checked":""}> ${f.l}</label>`;
  if(f.t==="area") return `<div class="field"><label>${f.l}</label><textarea class="inp" data-k="${f.k}" style="min-height:80px" placeholder="${esc(f.p||"")}">${esc(v)}</textarea></div>`;
  return `<div class="field"><label>${f.l}</label><input class="inp" data-k="${f.k}" type="${f.t||"text"}" ${f.num?'inputmode="decimal"':""} placeholder="${esc(f.p||"")}" value="${esc(f.num&&!f.raw&&v!==""?fmtN.format(v):v)}"></div>`;
}
function readFields(fields, root){
  const o={};
  const walk=fs=>fs.forEach(f=>{
    if(f.t==="row") return walk(f.f); if(f.t==="h") return;
    if(f.t==="chips"){ const on=root.querySelector(`[data-chips="${f.k}"] .chip.on`); o[f.k]= on? (f.numv? +on.dataset.v : on.dataset.v) : (f.d??""); return; }
    const el=root.querySelector(`[data-k="${f.k}"]`); if(!el) return;
    if(f.t==="check"){ o[f.k]=el.checked; return; }
    let val=el.value.trim(); if(f.num){ const n=parseAmount(val); val=isFinite(n)?n:null; } o[f.k]=val;
  }); walk(fields); return o;
}
function formSheet({title, fields, obj, onSave, onDelete, required}){
  openSheet(`<h2>${title}</h2><div id="fm">${fields.map(f=>fieldHTML(f,obj||{})).join("")}</div>
   <div class="actions">${onDelete?`<button class="btn danger" id="fDel">حذف</button>`:"<span></span>"}<div class="r"><button class="btn ghost" id="fX">إلغاء</button><button class="btn" id="fS">حفظ</button></div></div>`);
  $("#fm").querySelectorAll("[data-chips]").forEach(g=>g.onclick=e=>{ const b=e.target.closest("[data-v]"); if(!b) return; g.querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",x===b)); });
  $("#fX").onclick=closeSheet;
  if(onDelete) $("#fDel").onclick=onDelete;
  $("#fS").onclick=()=>{ const o=readFields(fields,$("#fm")); if(required && !o[required]){ const el=$("#fm").querySelector(`[data-k="${required}"]`); if(el) el.focus(); toast("هذا الحقل مطلوب"); return; } onSave(o); closeSheet(); };
}

function duePill(label, k){
  const d=daysTo(k); if(d==null) return "";
  const cls = d<0?"bad":d<=30?"warn":""; const txt = d<0?`منتهي منذ ${ayam(-d)}`:d===0?"ينتهي اليوم":`بعد ${ayam(d)}`;
  return `<span class="pill ${cls}">${label}: ${txt}</span>`;
}

function vehAlerts(){
  const out=[];
  vehicles().filter(v=>v.status!=="sold").forEach(v=>{
    [["insExpiry","التأمين"],["regExpiry","الملكية"]].forEach(([k,l])=>{ const d=daysTo(v[k]); if(d!=null && d<=30) out.push({vid:v.id, txt:`${l} — ${v.name}`, d}); });
    const logs=vlogs(v.id);
    const latestNext={};
    logs.forEach(l=>{ const key=(l.kind||"")+"|"+(l.title||""); if(latestNext[key]) return; latestNext[key]=1;
      const d=daysTo(l.nextDate); if(d!=null && d<=14) out.push({vid:v.id, txt:`${l.title} — ${v.name}`, d});
      else if(l.nextKm && v.odo && v.odo>=l.nextKm-500) out.push({vid:v.id, txt:`${l.title} — ${v.name} (عند ${fmtN.format(l.nextKm)} كم)`, d: v.odo>=l.nextKm? -1 : 1});
    });
    const open=logs.filter(l=>l.kind==="issue" && l.state!=="fixed").length;
    if(open) out.push({vid:v.id, txt:`${open} عطل لم يُصلح — ${v.name}`, d:null, issue:true});
  });
  return out.sort((a,b)=>(a.d??99)-(b.d??99));
}

function ageText(b){
  if(!b) return ""; const d=parseKey(b), n=new Date();
  let y=n.getFullYear()-d.getFullYear(), m=n.getMonth()-d.getMonth(); if(n.getDate()<d.getDate()) m--; if(m<0){ y--; m+=12; }
  if(y<0) return "";
  if(y<2) return (y*12+m)+" شهراً";
  return y+" سنة"+(m?" و"+m+" شهر":"");
}
function nextBirthday(b){
  if(!b) return null; const d=parseKey(b), t=new Date(); t.setHours(0,0,0,0);
  let nb=new Date(t.getFullYear(), d.getMonth(), d.getDate()); if(nb<t) nb=new Date(t.getFullYear()+1, d.getMonth(), d.getDate());

function krecRow(r){
  const K=KREC[r.kind]||KREC.school; let title=r.title||"", meta=[], right="";
  if(r.kind==="grade"){ title=r.subject; if(r.score!=null){ right=`<span class="c">${fmtN.format(r.score)}${r.outOf?" / "+fmtN.format(r.outOf):""}</span>`; } meta.push(r.term); }
  if(r.kind==="measure"){ title=[r.height&&r.height+" سم", r.weight&&r.weight+" كغ"].filter(Boolean).join(" · ")||"قياس"; }
  if(r.kind==="visit"){ meta.push(r.doctor); if(r.cost) right=`<span class="c">${money(r.cost,r.cur)}</span>`; }
  if(r.kind==="med"){ meta.push(r.dose); if(r.endDate) meta.push("حتى "+fmtShort.format(parseKey(r.endDate))); }
  if(r.kind==="appt"){ meta.push(r.time, r.place); if(r.done) meta.push("✓ تمّ"); }
  if(r.date) meta.unshift(fmtShort.format(parseKey(r.date)));
  const nx = r.nextDate? `<div class="meta" style="color:var(--acc)">${r.kind==="vaccine"?"الجرعة القادمة":"المراجعة"}: ${fmtShort.format(parseKey(r.nextDate))}</div>` : "";

  return `<div class="logrow" data-edit-krec="${r.id}"><span class="ic">${K.ic}</span><div class="t"><b>${esc(title)}</b><div class="meta">${esc(meta.filter(Boolean).join(" · "))}</div>${nx}${extra}</div>${right}</div>`;
}
function kidAlerts(){
  const out=[]; const t=todayKey();
  kids().forEach(k=>{
    const nb=nextBirthday(k.birth); if(nb && nb.days<=7) out.push({kid:k.id, ic:"🎂", txt:`عيد ميلاد ${k.name} (${nb.age} سنة)`, d:nb.days});
    [["passExpiry","جواز سفر"],["idExpiry","بطاقة هوية"]].forEach(([f,l])=>{ const d=daysTo(k[f]); if(d!=null && d<=60) out.push({kid:k.id, ic:"🪪", txt:`${l} ${k.name}`, d}); });
    krec(k.id).forEach(r=>{
      if(r.kind==="appt" && !r.done){ const d=daysTo(r.date); if(d!=null && d>=-1 && d<=7) out.push({kid:k.id, ic:"📅", txt:`${r.title} — ${k.name}${r.time?" · "+r.time:""}`, d}); }
      if((r.kind==="visit"||r.kind==="vaccine") && r.nextDate){ const d=daysTo(r.nextDate); if(d!=null && d>=-3 && d<=14) out.push({kid:k.id, ic:r.kind==="vaccine"?"💉":"🩺", txt:`${r.kind==="vaccine"?"جرعة":"مراجعة"}: ${r.title} — ${k.name}`, d}); }
      if(r.kind==="med" && r.date<=t && (!r.endDate || r.endDate>=t)) out.push({kid:k.id, ic:"💊", txt:`${r.title} — ${k.name}${r.dose?" · "+r.dose:""}`, d:null, med:true});
    });
  });
  return out.sort((a,b)=>(a.d??-99)-(b.d??-99));
}

function renderWell(){
  const W=wellMain(); const si=WSTAGES.findIndex(s=>s[0]===(W.stage||"explore"));

  const M={sev:"⚡ SEV كهربائي",tdem:"🧲 TDEM كهرومغناطيسي",ai:"🤖 أقمار / ذكاء اصطناعي",seismic:"📈 زلزالي",hydro:"🗺️ هيدروجيولوجية",other:"أخرى"};
  const ST={plan:"مخطط",run:"جارٍ",done:"منجز"};

  const exCost={}; ex.forEach(([n,x])=>{ if(x&&x.cost) exCost[x.cur||"TND"]=(exCost[x.cur||"TND"]||0)+x.cost; });
  const reads=fitems("wread").sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  return `<div class="card"><b>مراحل البئر</b><div class="small muted">اضغط على مرحلة لتجعلها الحالية</div>
   <div class="stages">${WSTAGES.map(([k,i,l],j)=>`<button class="${j<si?"done":j===si?"cur":""}" data-wstage="${k}"><b>${j<si?"✓":i}</b>${l}</button>`).join("")}</div></div>
  <div class="sec-h"><h2>🔎 الاستكشاف</h2>${Object.keys(exCost).length?`<span class="small muted">${Object.entries(exCost).map(([c,v])=>money(v,c)).join(" + ")}</span>`:""}</div>
  ${ex.map(([n,x])=> x ? `<div class="card wex st-${x.status||"plan"}" data-wex="${n}" style="cursor:pointer"><div class="vcard"><span class="ic">${n}</span><div class="t"><b>${M[x.method||"other"]}</b><span class="small muted">${esc([x.company, ST[x.status||"plan"], x.date&&fmtShort.format(parseKey(x.date))].filter(Boolean).join(" · "))}</span></div>${x.conf?`<span class="stars">${stars(+x.conf)}</span>`:""}</div>
     ${(x.depth||x.aquifer||x.point)?`<div class="pills">${x.depth?`<span class="pill">⬇️ ${esc(x.depth)}</span>`:""}${x.aquifer?`<span class="pill">${esc(x.aquifer)}</span>`:""}${x.point?`<span class="pill">📍 ${esc(x.point)}</span>`:""}</div>`:""}
     ${x.result?`<div class="small" style="margin-top:8px;white-space:pre-wrap;line-height:1.7">${esc(x.result)}</div>`:""}${x.reco?`<div class="small" style="margin-top:6px;color:var(--acc);white-space:pre-wrap">👉 ${esc(x.reco)}</div>`:""}</div>`
     : `<div class="card wex" data-wex="${n}" style="cursor:pointer;text-align:center;color:var(--muted)">➕ خانة الاستكشاف ${n}<div class="small">اضغط لإضافة دراسة</div></div>`).join("")}
  <div class="sec-h"><h2>${WSTAGES[si][1]} خطوات مرحلة ${WSTAGES[si][2]}</h2><button class="btn ghost sm" data-wstep-add="1">+ خطوة</button></div>
  <div class="card" style="padding:4px 12px">${steps.map((s,i)=>`<div class="ck ${s.done?"on":""}" data-wstep="${i}"><button class="chk ${s.done?"on":""}">${s.done?"✓":""}</button><span>${esc(s.t)}</span></div>`).join("")}</div>
  <div class="sec-h"><h2>💧 القراءات</h2><button class="btn ghost sm" data-new-wread="1">+ قراءة</button></div>
  <div class="card" style="padding:4px 12px">${reads.length?reads.map(r=>`<div class="logrow" data-edit-wread="${r.id}"><span class="ic">💧</span><div class="t"><b>${[r.stat!=null&&r.stat!==""&&"ساكن "+r.stat+" م", r.dyn!=null&&r.dyn!==""&&"حركي "+r.dyn+" م"].filter(Boolean).join(" · ")||"قراءة"}</b><div class="meta">${[r.date&&fmtShort.format(parseKey(r.date)), r.flow&&r.flow+" م³/س", r.sal&&r.sal+" غ/ل"].filter(Boolean).join(" · ")}</div></div></div>`).join(""):`<div class="empty">بعد الحفر: سجّل المستوى الساكن والحركي والصبيب والملوحة.</div>`}</div>`;

function renderFarm(){
  const NAV=[["sum","📊 ملخص"],["parcels","🗺️ القطع"],["log","📋 السجل"],["well","🚰 البئر"],["remote","📡 التحكم عن بعد"]].concat(Object.entries(FSEC).map(([k,v])=>[k,v.ic+" "+v.l])).concat([["workers","👷 العمال"]]);
  const seg=`<div class="fnav" id="fnav">${NAV.map(([k,l])=>`<button class="chip ${UI.fv===k?"on":""}" data-fv="${k}">${l}</button>`).join("")}</div>`;
  if(UI.fv==="well") return headerHTML("المزرعة","البطومة — تطاوين") + seg + renderWell();
  if(UI.fv==="remote") return headerHTML("المزرعة","البطومة — تطاوين") + seg + renderRemote();
  if(FSEC[UI.fv]) return headerHTML("المزرعة","البطومة — تطاوين") + seg + (UI.fitem && S.data.fitem[UI.fitem] ? renderFItem(UI.fitem) : renderFSec(UI.fv));
  const P=farmP(), L=farmL(), W=farmW(), t=todayKey(), yr=t.slice(0,4);
  let body="";
  if(UI.fv==="sum"){
    const area=P.reduce((s,x)=>s+(+x.area||0),0), trees=P.reduce((s,x)=>s+(+x.trees||0),0);
    const cost={}, inc={}; L.filter(l=>(l.date||"").startsWith(yr)&&l.done!==false).forEach(l=>{ if(l.cost) cost[l.cur||"TND"]=(cost[l.cur||"TND"]||0)+l.cost; if(l.income) inc[l.cur||"TND"]=(inc[l.cur||"TND"]||0)+l.income; });
    W.forEach(w=>farmWL(w.id).filter(x=>x.kind==="pay"&&(x.date||"").startsWith(yr)).forEach(x=>{ cost[x.cur||"TND"]=(cost[x.cur||"TND"]||0)+(x.amount||0); }));
    const fmtS=o=>Object.keys(o).length?Object.entries(o).map(([c,x])=>money(x,c)).join(" + "):"0";
    const owed=W.map(w=>({w,b:wBalance(w.id)})).filter(x=>x.b.owed>0);
    const planned=L.filter(isPlanned).sort((a,b)=>(a.date||"").localeCompare(b.date||""));
    const lastIrr=P.map(p=>{ const l=L.find(x=>x.kind==="irrig"&&x.parcel===p.id&&x.done!==false&&x.date<=t); return {p, d:l?-daysTo(l.date):null}; }).filter(x=>x.p.irrig&&x.p.irrig!=="rain"&&x.p.irrig!=="none");
    const treesR=fitems("trees").reduce((s,x)=>s+(fCount(x)||0),0); const sheepN=fitems("sheep").reduce((s,x)=>s+(fCount(x)||0),0); const poulN=fitems("poultry").reduce((s,x)=>s+(fCount(x)||0),0);
    const WM=wellMain(); const ws=WSTAGES.find(s=>s[0]===(WM.stage||"explore"));
    body=`<div class="stats"><div class="stat"><b>${fmtN.format(area)}</b><span>هكتار</span></div><div class="stat"><b>${P.length}</b><span>قطعة</span></div><div class="stat"><b>${fmtN.format(treesR||trees)}</b><span>شجرة</span></div></div>
    <div class="pills" style="margin:10px 0 2px"><span class="pill" data-fv="well" style="cursor:pointer">🚰 البئر: ${ws[2]}</span>${sheepN?`<span class="pill" data-fv="sheep" style="cursor:pointer">🐑 ${fmtN.format(sheepN)}</span>`:""}${poulN?`<span class="pill" data-fv="poultry" style="cursor:pointer">🐔 ${fmtN.format(poulN)}</span>`:""}</div>
    <div class="msum" style="margin-top:12px"><div class="stat out"><b style="font-size:16px">${fmtS(cost)}</b><span>تكاليف ${yr}</span></div><div class="stat"><b style="font-size:16px">${fmtS(inc)}</b><span>مداخيل ${yr}</span></div></div>

function renderToday(){
  const k=todayKey(), d=new Date();
  const sub = `${DAYS[d.getDay()]} ${fmtG.format(d)}${fmtH?"<br>"+fmtH.format(d):""}`;
  const h=d.getHours(); const greet = h<12?"صباح الخير ☀️":h<18?"مساء الخير 🌤️":"مساء الخير 🌙";
  const tt = tasksOn(k);
  const overdue = tasks().filter(t=>!t.done && t.date && t.date<k).sort(taskSort);
  const rts = routinesOn(k);
  const doneT = tt.filter(t=>t.done).length;
  let rtTot=0, rtDone=0; rts.forEach(r=>{rtTot+=(r.items||[]).length; rtDone+=routineDone(r,k).length;});
  const todayHol = holidayOn(k); const nh = nextHoliday(k);
  const todayCls = todayHol? [] : classesOnWd(d.getDay());
  const pinned = notes().filter(n=>n.pinned).sort((a,b)=>(b.updated||0)-(a.updated||0)).slice(0,4);
  return headerHTML(greet, sub) + `
  <div class="stats">
    <div class="stat"><b>${doneT}/${tt.length}</b><span>مهام اليوم</span></div>
    <div class="stat"><b>${rtTot?Math.round(rtDone/rtTot*100):0}%</b><span>البرامج</span></div>
    <div class="stat"><b>${Object.keys(S.data.notes).length}</b><span>مذكرة</span></div>
  </div>
  ${(()=>{const lb=lastBackupDays(); const n=countItems(); return n>=5 && (lb==null||lb>=14)?`<div class="card" style="display:flex;align-items:center;gap:10px;border-color:var(--gold)"><span style="font-size:22px">💾</span><div style="flex:1" class="small">${lb==null?"لم تأخذ نسخة احتياطية بعد.":"آخر نسخة احتياطية قبل "+lb+" يوم."} بياناتك على هذا الهاتف فقط.</div><button class="btn sm" id="bkNow">نسخة الآن</button></div>`:"";})()}
  ${(()=>{const al=farmAlerts(); return al.length?`<div class="sec-h"><h2>🌾 المزرعة</h2></div><div class="card" style="padding:6px 12px">${al.map(a=>`<div class="logrow" ${a.fitem?`data-fitem="${a.fitem}" data-fsec="${a.sec}"`:`data-edit-flog="${a.id}"`}><span class="ic">📌</span><div class="t"><b>${esc(a.txt)}</b><div class="meta">${a.d<0?"متأخر "+ayam(a.d):a.d===0?"اليوم":a.d===1?"غداً":"بعد "+ayam(a.d)}</div></div></div>`).join("")}</div>`:"";})()}
  ${(()=>{const al=kidAlerts(); return al.length?`<div class="sec-h"><h2>👨‍👩‍👧 الأطفال</h2></div><div class="card" style="padding:6px 12px">${al.map(a=>`<div class="logrow" data-kid="${a.kid}"><span class="ic">${a.ic}</span><div class="t"><b>${esc(a.txt)}</b>${a.d!=null?`<div class="meta">${a.d<0?"فات منذ "+ayam(a.d):a.d===0?"اليوم":a.d===1?"غداً":"بعد "+ayam(a.d)}</div>`:a.med?`<div class="meta">دواء جارٍ</div>`:""}</div></div>`).join("")}</div>`:"";})()}
  ${(()=>{const al=vehAlerts(); return al.length?`<div class="sec-h"><h2>🚙 تنبيهات المركبات</h2></div><div class="card" style="padding:6px 12px">${al.map(a=>`<div class="logrow" data-veh="${a.vid}"><span class="ic">${a.issue?"⚠️":a.d!=null&&a.d<0?"🔴":"🟠"}</span><div class="t"><b>${esc(a.txt)}</b>${a.d!=null&&!a.issue?`<div class="meta">${a.d<0?"متأخر":a.d===0?"اليوم":"بعد "+ayam(a.d)}</div>`:""}</div></div>`).join("")}</div>`:"";})()}
  ${todayHol?holBanner(todayHol):""}
  ${todayCls.length?`<div class="sec-h"><h2>جدول اليوم</h2></div><div class="card" style="padding:8px 12px">${classList(todayCls,true)}</div>`:""}
  ${!todayHol&&nh&&daysTo(nh.from)<=7?`<div class="small muted" style="margin:-4px 4px 10px">${(HOLK[nh.kind]||HOLK.off)[0]} ${esc(nh.title)} بعد ${ayam(daysTo(nh.from))}</div>`:""}
  ${overdue.length?`<div class="sec-h"><h2 style="color:var(--warn)">متأخرة</h2></div><div class="card">${overdue.map(t=>taskRow(t,true)).join("")}</div>`:""}
  <div class="sec-h"><h2>مهام اليوم</h2><button class="btn ghost sm" data-new-task="${k}">+ مهمة</button></div>
  <div class="card">${tt.length?tt.map(t=>taskRow(t)).join(""):`<div class="empty">لا مهام لليوم. أضف ما تريد إنجازه.</div>`}</div>
  <div class="sec-h"><h2>برامج اليوم</h2><button class="btn ghost sm" data-goto="programs">كل البرامج</button></div>

function renderPlan(){
  const ws = weekStart(UI.weekOff), we=addDays(ws,6), tk=todayKey();
  const week = Array.from({length:7},(_,i)=>addDays(ws,i));
  const sel = UI.sel, sd=parseKey(sel);
  const st = tasksOn(sel), rts=routinesOn(sel);
  const undated = tasks().filter(t=>!t.date).sort(taskSort);
  const allOpen = tasks().filter(t=>!t.done).sort((a,b)=>(a.date||"9999").localeCompare(b.date||"9999")||taskSort(a,b));
  const doneAll = tasks().filter(t=>t.done).sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  let body="";
  if(UI.planView==="week"){
    body = `<div class="card">
      <div class="weeknav"><button class="icon-btn" data-week="-1" aria-label="السابق">→</button>
        <b>${fmtShort.format(ws)} – ${fmtShort.format(we)}</b>
        <button class="icon-btn" data-week="1" aria-label="التالي">←</button></div>
      <div class="week">${week.map(d=>{const k=keyOf(d);const n=tasksOn(k).filter(t=>!t.done).length; const hl=holidayOn(k);
        return `<button class="day ${k===tk?"today":""} ${k===sel?"sel":""} ${hl?"hol":""}" data-day="${k}" ${hl?`title="${esc(hl.title)}"`:""}>${DAYS_S[d.getDay()]}<span class="n">${d.getDate()}</span><span class="dots">${"<i></i>".repeat(Math.min(n,3))}</span></button>`;}).join("")}</div>
      ${UI.weekOff!==0?`<div style="text-align:center;margin-top:10px"><button class="btn ghost sm" data-week="0">العودة لهذا الأسبوع</button></div>`:""}
    </div>
    <div class="sec-h"><h2>${DAYS[sd.getDay()]} ${fmtShort.format(sd)}</h2><button class="btn ghost sm" data-new-task="${sel}">+ مهمة</button></div>
    <div class="card">${st.length?st.map(t=>taskRow(t)).join(""):`<div class="empty">لا مهام في هذا اليوم.</div>`}</div>
    ${(()=>{const hl=holidayOn(sel); if(hl) return holBanner(hl); const l=classesOnWd(sd.getDay()); return l.length?`<div class="sec-h"><h2>الحصص</h2></div><div class="card" style="padding:8px 12px">${classList(l, sel===tk)}</div>`:"";})()}
    ${rts.length?`<div class="sec-h"><h2>البرامج</h2></div>${rts.map(r=>routineCard(r,sel,false)).join("")}`:""}
    <div class="sec-h"><h2>بلا موعد</h2><button class="btn ghost sm" data-new-task="">+ مهمة</button></div>
    <div class="card">${undated.length?undated.map(t=>taskRow(t)).join(""):`<div class="empty">أفكار ومهام بلا تاريخ محدد تظهر هنا.</div>`}</div>`;
  } else if(UI.planView==="classes"){
    body = renderClassesWeek();
  } else {
    body = `<div class="card">${allOpen.length?allOpen.map(t=>taskRow(t,true)).join(""):`<div class="empty">لا مهام مفتوحة 🎉</div>`}</div>
    ${doneAll.length?`<div class="sec-h"><h2>منجزة (${doneAll.length})</h2><button class="btn danger sm" id="clearDone">حذف المنجزة</button></div><div class="card">${doneAll.slice(0,30).map(t=>taskRow(t,true)).join("")}</div>`:""}`;
  }
  return headerHTML("المخطط","مهامك موزعة على أيام الأسبوع") +
   `<div class="seg"><button data-pv="week" class="${UI.planView==="week"?"on":""}">الأسبوع</button><button data-pv="classes" class="${UI.planView==="classes"?"on":""}">جدول الحصص</button><button data-pv="all" class="${UI.planView==="all"?"on":""}">كل المهام</button></div>` + body;
}

function noteCard(n){
  const d = n.updated? fmtShort.format(new Date(n.updated)) : "";
  return `<div class="note c-${n.color||"none"}" data-note="${n.id}">
    ${n.title?`<h3>${n.pinned?'<span class="pin">📌</span> ':""}${esc(n.title)}</h3>`:(n.pinned?'<span class="pin">📌</span>':"")}
    <p>${esc(n.body||"")}</p><div class="foot"><span>${esc(n.tag||"")}</span><span>${d}</span></div></div>`;
}
function renderNotes(){
  const q = UI.noteQ.trim().toLowerCase();
  let list = notes().filter(n=>!q || (n.title||"").toLowerCase().includes(q) || (n.body||"").toLowerCase().includes(q) || (n.tag||"").toLowerCase().includes(q));
  list.sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0) || (b.updated||0)-(a.updated||0));
  const tags = [...new Set(notes().map(n=>n.tag).filter(Boolean))];
  return headerHTML("المذكرات","أفكار، يوميات، ملاحظات سريعة") +
   `<input class="search" id="noteQ" placeholder="🔍 ابحث في المذكرات…" value="${esc(UI.noteQ)}">
   ${tags.length?`<div class="chips" style="margin-bottom:12px">${tags.map(t=>`<button class="chip ${UI.noteQ===t?"on":""}" data-tag="${esc(t)}">#${esc(t)}</button>`).join("")}</div>`:""}
   ${list.length?`<div class="notes">${list.map(noteCard).join("")}</div>`:`<div class="card empty">${q?"لا نتائج.":"لا مذكرات بعد. اضغط + لكتابة أول مذكرة."}</div>`}`;
}
function renderPrograms(){
  const k=todayKey(); const list=routines();
  return `<button class="back" data-goto="today">→ اليوم</button>` + headerHTML("البرامج","روتين يومي أو أسبوعي تتابعه بالتأشير") +
   (list.length? list.map(r=>{
     const wd=new Date().getDay(); const active=!r.days||r.days.length===0||r.days.includes(wd);
     return active? routineCard(r,k,false) : `<div style="opacity:.6">${routineCard(r,k,true).replace('<div class="bar">','<div class="small muted" style="margin-top:6px">ليس من أيام هذا البرنامج اليوم</div><div class="bar" style="display:none">')}</div>`;
   }).join("") + streaks(list)
   : `<div class="card empty">لا برامج بعد.<br><br>أمثلة: برنامج الصباح (أذكار، رياضة، قراءة)، برنامج المساء، مراجعة الأسبوع…<br><br><button class="btn" data-new-rt="1">+ برنامج جديد</button><br><br><button class="btn ghost sm" id="samples">أضف أمثلة جاهزة</button></div>`);
}
function streaks(list){
  // last 7 days completion per routine
  const days = Array.from({length:7},(_,i)=>addDays(new Date(),i-6));
  return `<div class="sec-h"><h2>آخر ٧ أيام</h2></div><div class="card">${list.map(r=>{
    const n=(r.items||[]).length;
    return `<div style="display:flex;align-items:center;gap:8px;padding:6px 0"><span style="flex:1">${esc(r.icon||"🔁")} ${esc(r.name)}</span>${days.map(d=>{
      const k=keyOf(d); const wd=d.getDay(); const active=!r.days||r.days.length===0||r.days.includes(wd);
      const c=routineDone(r,k).length; const p=n?c/n:0;
      const bg=!active?"transparent":p>=1?"var(--acc)":p>0?"var(--acc2)":"var(--line)";
      return `<span title="${DAYS_S[wd]}" style="width:18px;height:18px;border-radius:5px;background:${bg};border:1px solid var(--line)"></span>`;}).join("")}</div>`;
  }).join("")}<div class="small muted" style="margin-top:6px">المربع الممتلئ = برنامج مكتمل في ذلك اليوم</div></div>`;
}

function render(){
  if(window.__dlocked) return;
  const app=$("#app"); const y=window.scrollY;
  const focusQ = document.activeElement && document.activeElement.id==="noteQ";
  app.innerHTML = UI.tab==="today"?renderToday():UI.tab==="plan"?renderPlan():UI.tab==="notes"?renderNotes():UI.tab==="money"?renderMoney():UI.tab==="cars"?renderCars():UI.tab==="kids"?renderKids():UI.tab==="farm"?renderFarm():renderPrograms();
  setSync();
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.tab===UI.tab));
  if(focusQ){ const i=$("#noteQ"); i.focus(); i.setSelectionRange(i.value.length,i.value.length); }
  window.scrollTo(0,y);
}

/* ---------- sheets ---------- */
let sheetLocked=false;
let ignorePop=false;
function openSheet(html, locked){ sheetLocked=!!locked; $("#sheet").innerHTML=html; $("#sheet").scrollTop=0; $("#ov").classList.add("show");
  try{ if(!(history.state&&history.state.sheet)) history.pushState({sheet:1},""); }catch(e){} }
function closeSheet(force){ if(sheetLocked && force!==true) return; sheetLocked=false; $("#ov").classList.remove("show"); $("#sheet").innerHTML=""; render();
  try{ if(history.state&&history.state.sheet){ ignorePop=true; history.back(); } }catch(e){} }
window.addEventListener("popstate",()=>{ if(ignorePop){ ignorePop=false; return; } if($("#ov").classList.contains("show")){ if(sheetLocked){ try{ history.pushState({sheet:1},""); }catch(e){} return; } closeSheet(); } });
$("#ov").addEventListener("click",e=>{ if(e.target.id==="ov" && !$("#sheet").querySelector("input:not([type=checkbox]),textarea,select")) closeSheet(); });
function confirmSheet(msg, onYes){
  openSheet(`<h2>${esc(msg)}</h2><div class="actions"><button class="btn ghost" id="cNo">إلغاء</button><button class="btn" style="background:var(--warn)" id="cYes">حذف</button></div>`);
  $("#cNo").onclick=closeSheet; $("#cYes").onclick=()=>{ closeSheet(); onYes(); };
}

function editTask(id, defDate){
  const t = id? S.data.tasks[id] : {title:"",date:defDate??todayKey(),time:"",priority:0,done:false,note:""};
  openSheet(`<h2>${id?"تعديل المهمة":"مهمة جديدة"}</h2>
   <div class="field"><input class="inp" id="tT" placeholder="ماذا تريد أن تنجز؟" value="${esc(t.title)}"></div>
   <div class="row"><div class="field"><label>التاريخ</label><input class="inp" type="date" id="tD" value="${esc(t.date||"")}"></div>
   <div class="field"><label>الوقت</label><input class="inp" type="time" id="tM" value="${esc(t.time||"")}"></div></div>
   <div class="field"><label>الأولوية</label><div class="chips" id="tP">${["عادية","مهمة","عاجلة"].map((l,i)=>`<button class="chip ${(t.priority||0)===i?"on":""}" data-p="${i}">${l}</button>`).join("")}</div></div>
   <div class="field"><label>ملاحظة</label><textarea class="inp" id="tN" style="min-height:80px">${esc(t.note||"")}</textarea></div>

const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
async function pinHash(pin, salt){
  const data=new TextEncoder().encode(String(pin));
  if(window.crypto && crypto.subtle){
    const key=await crypto.subtle.importKey("raw",data,"PBKDF2",false,["deriveBits"]);
    const bits=await crypto.subtle.deriveBits({name:"PBKDF2",salt:unb64(salt),iterations:150000,hash:"SHA-256"},key,256);
    return b64(bits);
  }
  let h1=0xdeadbeef, h2=0x41c6ce57; const s=salt+":"+pin;   // fallback when not on https
  for(let r=0;r<20000;r++){ for(let i=0;i<s.length;i++){ const ch=s.charCodeAt(i); h1=Math.imul(h1^ch,2654435761); h2=Math.imul(h2^ch,1597334677); }
    h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909); h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909); }
  return "f:"+(h2>>>0).toString(16)+(h1>>>0).toString(16);
}

  el.innerHTML=`<div class="lk-in"><div class="lk-logo">📒</div><h2>دفتري الشخصي</h2><div class="lk-msg" id="lkMsg">${msg||(LK.bio?"البصمة أو رمز الدخول":"أدخل رمز الدخول")}</div>
   <div class="dots" id="lkDots">${Array.from({length:n},(_,i)=>`<i class="${i<lkEntry.length?"on":""}"></i>`).join("")}</div>
   <div class="pad">${[1,2,3,4,5,6,7,8,9].map(d=>`<button data-pd="${d}">${d}</button>`).join("")}${LK.bio?`<button class="ghost" data-pbio="1" aria-label="البصمة">☝️</button>`:`<span></span>`}<button data-pd="0">0</button><button class="ghost" data-pdel="1" aria-label="حذف">⌫</button></div>
   <button class="lk-link" id="lkForgot">نسيت الرمز؟</button></div>`;
}
function updDots(){ const d=$("#lkDots"); if(d) d.querySelectorAll("i").forEach((x,i)=>x.classList.toggle("on",i<lkEntry.length)); }
async function lockClick(e){
  const b=e.target.closest("button"); if(!b) return;
  if(b.id==="lkForgot") return drawForgot();
  if(b.id==="lkBack"){ lkEntry=""; return drawLock(); }
  if(b.id==="lkWipe"){ if(($("#lkConfirm").value||"").trim()!=="مسح"){ $("#lkMsg2").textContent="اكتب كلمة: مسح"; return; } return lockReset(); }
  if(b.dataset.pbio) return tryBio();
  const f=lockFails();
  if(Date.now()<f.until){ $("#lkMsg").textContent=`محاولات كثيرة. انتظر ${Math.ceil((f.until-Date.now())/1000)} ثانية`; return; }
  if(b.dataset.pdel){ lkEntry=lkEntry.slice(0,-1); return updDots(); }
  if(b.dataset.pd!=null){
    const n=LK.len||4; if(lkEntry.length>=n) return;
    lkEntry+=b.dataset.pd; updDots();
    if(lkEntry.length===n){
      if((await pinHash(lkEntry,LK.salt))===LK.hash) return unlock();
      const nf={n:f.n+1, until:0}; if(nf.n>=5) nf.until=Date.now()+30000*Math.pow(2,Math.min(nf.n-5,6)); setLockFails(nf);
      lkEntry=""; const dots=$("#lkDots"); dots.classList.remove("shake"); void dots.offsetWidth; dots.classList.add("shake"); updDots();
      $("#lkMsg").textContent = nf.until? `محاولات كثيرة. انتظر ${Math.ceil((nf.until-Date.now())/1000)} ثانية` : "رمز غير صحيح";
    }
  }
}
async function tryBio(){
  if(!LK||!LK.bio||!window.__dlocked) return;
  try{ if(await bioVerify()) unlock(); }catch(e){ const m=$("#lkMsg"); if(m) m.textContent="أدخل الرمز، أو اضغط ☝️ للبصمة"; }
}
function drawForgot(){
  $("#lock").innerHTML=`<div class="lk-in"><div class="lk-logo">🔑</div><h2>نسيت الرمز</h2>
   <p class="small" style="line-height:1.9">${LK.bio?"جرّب الدخول بالبصمة أولاً.<br>":""}لا يمكن استرجاع الرمز. الحل الوحيد: <b>مسح بيانات التطبيق من هذا الجهاز</b> ثم استعادتها من آخر نسخة احتياطية.</p>
   <input class="inp" id="lkConfirm" placeholder="اكتب: مسح" style="text-align:center">
   <div class="small" id="lkMsg2" style="color:var(--warn);min-height:20px;margin:6px 0"></div>
   <button class="btn" style="background:var(--warn);width:100%" id="lkWipe">مسح وإعادة الضبط</button>
   <button class="lk-link" id="lkBack">رجوع</button></div>`;
}
async function lockReset(){
  window.__wiping=true;
  try{ await fetch("api/logout",{method:"POST",credentials:"same-origin"}); }catch(e){}
  try{ Object.keys(localStorage).filter(k=>k.startsWith("daftar.")).forEach(k=>localStorage.removeItem(k)); }catch(e){}
  location.reload();
}
document.addEventListener("visibilitychange",()=>{
  if(!LK) return;
  if(document.hidden){ lkHiddenAt=Date.now(); if(!LK.timeout) lockNow(); }
  else if(window.__dlocked){ if(LK.bio) setTimeout(tryBio,350); }
  else if(lkHiddenAt && Date.now()-lkHiddenAt>=(LK.timeout||0)*1000) lockNow();
});
async function lockSettingsCard(){
  const act=$("#sheet .actions"); if(!act) return;
  const card=document.createElement("div"); card.className="card"; card.id="lockCard";
  const bioOK=await bioAvailable();
  if(!LK) card.innerHTML=`<b>🔒 قفل التطبيق</b><p class="small muted">اطلب رمزاً${bioOK?" أو بصمة":""} عند فتح التطبيق على هذا الجهاز.</p><button class="btn sm" id="lkOn">تفعيل القفل</button>`;
  else card.innerHTML=`<b>🔒 قفل التطبيق: مفعّل ✓</b>
   <div class="field" style="margin-top:8px"><label>يُقفل تلقائياً بعد مغادرة التطبيق بـ</label><div class="chips" id="lkT">${[[0,"فوراً"],[60,"دقيقة"],[300,"5 دقائق"]].map(([v,l])=>`<button class="chip ${(LK.timeout||0)===v?"on":""}" data-t="${v}">${l}</button>`).join("")}</div></div>
   ${bioOK?`<div class="chk-line"><span style="flex:1">☝️ الدخول بالبصمة ${LK.bio?"(مفعّل)":""}</span><button class="btn ${LK.bio?"ghost":""} sm" id="lkBio">${LK.bio?"إيقاف":"تفعيل"}</button></div>`:`<p class="small muted">البصمة غير متاحة هنا${window.isSecureContext?"":" (تحتاج رابطاً آمناً يبدأ بـ https)"}.</p>`}
   <button class="btn ghost sm" id="lkChange">تغيير الرمز</button> <button class="btn danger sm" id="lkOff">إيقاف القفل</button>`;
  act.parentNode.insertBefore(card, act);
  const q=s=>card.querySelector(s);
  if(q("#lkOn")) q("#lkOn").onclick=()=>pinSetup(false);
  if(q("#lkT")) q("#lkT").onclick=e=>{ const b=e.target.closest("[data-t]"); if(!b) return; lockSave(Object.assign({},LK,{timeout:+b.dataset.t})); q("#lkT").querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",x===b)); };
  if(q("#lkBio")) q("#lkBio").onclick=async()=>{
    if(LK.bio){ lockSave(Object.assign({},LK,{bio:null})); toast("أُوقفت البصمة"); openSettings(); return; }
    try{ const id=await bioRegister(); lockSave(Object.assign({},LK,{bio:id})); toast("فُعّلت البصمة ✓"); openSettings(); }catch(e){ toast("لم تُفعّل البصمة"); }
  };
  if(q("#lkChange")) q("#lkChange").onclick=()=>pinSetup(true);
  if(q("#lkOff")) q("#lkOff").onclick=()=>pinVerifyThen("أدخل الرمز الحالي لإيقاف القفل",()=>{ lockSave(null); toast("أُوقف القفل"); openSettings(); });
}
const PIN_INP='type="password" inputmode="numeric" maxlength="6" autocomplete="off" style="text-align:center;font-size:22px;letter-spacing:8px"';
function pinSetup(change){
  const go=()=>{
    openSheet(`<h2>${change?"رمز جديد":"تفعيل القفل"}</h2><p class="small muted">اختر رمزاً من 4 إلى 6 أرقام. لا يمكن استرجاعه إن نسيته، فاحتفظ دائماً بنسخة احتياطية.</p>
     <div class="field"><input class="inp" id="p1" ${PIN_INP} placeholder="الرمز"></div>
     <div class="field"><input class="inp" id="p2" ${PIN_INP} placeholder="أعد كتابة الرمز"></div>
     <div class="small" id="pE" style="color:var(--warn);min-height:20px"></div>
     <div class="actions"><span></span><div class="r"><button class="btn ghost" id="pX">إلغاء</button><button class="btn" id="pS">حفظ</button></div></div>`);
    setTimeout(()=>$("#p1").focus(),50);
    $("#pX").onclick=()=>openSettings();
    $("#pS").onclick=async()=>{
      const a=$("#p1").value.replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)), b=$("#p2").value.replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d));
      if(!/^\d{4,6}$/.test(a)){ $("#pE").textContent="الرمز من 4 إلى 6 أرقام"; return; }
      if(a!==b){ $("#pE").textContent="الرمزان غير متطابقين"; return; }
      const salt=b64(crypto.getRandomValues(new Uint8Array(16)));
      lockSave(Object.assign({timeout:60,bio:null},LK||{},{salt, hash:await pinHash(a,salt), len:a.length}));
      toast(change?"تغيّر الرمز ✓":"فُعّل القفل ✓"); openSettings();
    };
  };
  if(change) pinVerifyThen("أدخل الرمز الحالي", go); else go();
}
function pinVerifyThen(title, fn){
  openSheet(`<h2>${title}</h2><div class="field"><input class="inp" id="pv" ${PIN_INP}></div><div class="small" id="pE" style="color:var(--warn);min-height:20px"></div>
   <div class="actions"><span></span><div class="r"><button class="btn ghost" id="pX">إلغاء</button><button class="btn" id="pS">متابعة</button></div></div>`);
  setTimeout(()=>$("#pv").focus(),50);
  $("#pX").onclick=()=>openSettings();
  $("#pS").onclick=async()=>{ const v=$("#pv").value.replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)); if((await pinHash(v,LK.salt))===LK.hash) fn(); else $("#pE").textContent="رمز غير صحيح"; };
}
if(LK) lockNow();

render();
if("serviceWorker" in navigator){ window.addEventListener("load",()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); }); }
})();
</script>
